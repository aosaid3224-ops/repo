<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta http-equiv="cache-control" content="no-cache">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppData Manager Repo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, sans-serif;
            background: #0a0a0f;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .logo {
            width: 80px;
            height: 80px;
            background: #6b4ee6;
            border-radius: 20px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }
        h1 { font-size: 24px; margin-bottom: 8px; }
        p { color: #888; margin-bottom: 32px; font-size: 15px; }
        .url-box {
            background: #14141f;
            border: 1px solid #2a2a3a;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            position: relative;
        }
        .url-box code {
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 14px;
            color: #6b4ee6;
            word-break: break-all;
            display: block;
            text-align: left;
            direction: ltr;
        }
        .copy-btn {
            background: #6b4ee6;
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .copy-btn:hover { background: #5a3fd4; }
        .copy-btn:active { transform: scale(0.98); }
        .steps {
            margin-top: 32px;
            text-align: right;
        }
        .steps h3 { font-size: 16px; margin-bottom: 12px; color: #ccc; }
        .step {
            background: #14141f;
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .step-num {
            background: #6b4ee6;
            color: #fff;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
            flex-shrink: 0;
        }
        .step-text { font-size: 14px; color: #ddd; }
        .footer {
            margin-top: 32px;
            font-size: 12px;
            color: #555;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #6b4ee6;
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">📱</div>
        <h1>AppData Manager Repo</h1>
        <p>مستودع Sileo / Cydia لأداة AppData Manager</p>

        <div class="url-box">
            <code id="repo-url">https://aosaid3224-ops.github.io/repo/</code>
        </div>
        <button class="copy-btn" onclick="copyURL()">نسخ الرابط</button>

        <div class="steps">
            <h3>طريقة الإضافة في Sileo:</h3>
            <div class="step">
                <div class="step-num">1</div>
                <div class="step-text">افتح تطبيق Sileo</div>
            </div>
            <div class="step">
                <div class="step-num">2</div>
                <div class="step-text">انتقل إلى تبويبة Sources</div>
            </div>
            <div class="step">
                <div class="step-num">3</div>
                <div class="step-text">اضغط على زر + في الأعلى</div>
            </div>
            <div class="step">
                <div class="step-num">4</div>
                <div class="step-text">الصق الرابط أعلاه واضغط Add</div>
            </div>
        </div>

        <div class="footer">
            Developed by ZAIN | AppData Manager
        </div>
    </div>

    <div class="toast" id="toast">تم النسخ!</div>

    <script>
        function copyURL() {
            const url = document.getElementById('repo-url').innerText;
            navigator.clipboard.writeText(url).then(() => {
                const toast = document.getElementById('toast');
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2000);
            });
        }
    </script>
<!-- cache-bust: v1.2.7 -->

</body>
</html>
